<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>四艺堂管理系统 - 授权密钥生成器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Microsoft YaHei', Arial, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #f0f4ff, #e8f4f8);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: 50px auto;
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
    }
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    .header .logo {
      width: 100px;
      height: 100px;
      background: linear-gradient(135deg, #4e6ef2, #2dd4bf);
      border-radius: 50%;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      color: white;
    }
    .header h1 {
      color: #1f2937;
      font-size: 28px;
      margin-bottom: 10px;
    }
    .header p {
      color: #6b7280;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 25px;
    }
    .form-group label {
      display: block;
      color: #374151;
      font-size: 15px;
      margin-bottom: 10px;
      font-weight: 500;
    }
    .form-group input {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      transition: all 0.3s;
      background: #f9fafb;
    }
    .form-group input:focus {
      border-color: #4e6ef2;
      background: white;
      box-shadow: 0 0 0 3px rgba(78, 110, 242, 0.1);
    }
    .btn-generate {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #4e6ef2, #2dd4bf);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 30px;
    }
    .btn-generate:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }
    .result-card {
      background: #f9fafb;
      border-radius: 16px;
      padding: 25px;
      margin-top: 20px;
      border: 1px solid #e5e7eb;
      display: none;
    }
    .result-card.show {
      display: block;
    }
    .result-card h3 {
      color: #1f2937;
      font-size: 18px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .result-card h3 span {
      color: #4e6ef2;
      font-size: 20px;
    }
    .key-display {
      position: relative;
      background: #e5e7eb;
      border-radius: 10px;
      padding: 15px;
      margin: 15px 0;
      word-break: break-all;
      font-size: 14px;
      color: #1f2937;
    }
    .btn-copy {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #4e6ef2;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .quick-days {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .quick-days-label {
      width: 100%;
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 2px;
    }
    .quick-day-btn {
      flex: 1 1 auto;
      min-width: 70px;
      padding: 8px 12px;
      background: #f3f4f6;
      color: #374151;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .quick-day-btn:hover {
      background: #e0e7ff;
      border-color: #4e6ef2;
      color: #4e6ef2;
    }
    .quick-day-btn.active {
      background: linear-gradient(135deg, #4e6ef2, #2dd4bf);
      color: white;
      border-color: transparent;
    }
    .hint-text {
      margin: 8px 0 0;
      font-size: 12px;
      color: #6b7280;
      min-height: 16px;
    }
    .hint-text.error {
      color: #ef4444;
    }
    .hint-text.success {
      color: #10b981;
    }
    .hidden {
      display: none !important;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
      font-size: 14px;
      color: #4b5563;
    }
    .info-row span:first-child {
      color: #6b7280;
    }
    .footer {
      text-align: center;
      margin-top: 40px;
      color: #9ca3af;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 头部 -->
    <div class="header">
      <div class="logo">🔑</div>
      <h1>授权密钥生成器</h1>
      <p>未策 - 开发者专用</p>
    </div>

    <!-- 表单 -->
    <div class="form-group">
      <label style="display: flex; align-items: center; cursor: pointer; user-select: none;">
        <input type="checkbox" id="renewMode" style="margin-right: 8px; width: 16px; height: 16px; cursor: pointer;">
        <span>基于旧密钥延续到期时间</span>
      </label>
    </div>

    <div class="form-group" id="machineCodeGroup">
      <label for="machineCode">用户设备机器码</label>
      <input type="text" id="machineCode" placeholder="粘贴用户提供的机器码（包含末尾==）">
    </div>

    <div class="form-group hidden" id="oldKeyGroup">
      <label for="oldKey">旧授权密钥</label>
      <input type="text" id="oldKey" placeholder="粘贴需要延续的旧密钥（包含末尾==）">
      <p id="oldKeyInfo" class="hint-text"></p>
    </div>

    <div class="form-group">
      <label for="days" id="daysLabel">授权有效期（天数）</label>
      <input type="number" id="days" value="365" min="1" placeholder="例如：365 表示授权1年">
      <div class="quick-days" id="quickDays">
        <span class="quick-days-label" id="quickDaysLabel">快速选择：</span>
        <button type="button" class="quick-day-btn" data-days="7">7天</button>
        <button type="button" class="quick-day-btn" data-days="15">15天</button>
        <button type="button" class="quick-day-btn" data-days="30">30天</button>
        <button type="button" class="quick-day-btn" data-days="90">一季度</button>
        <button type="button" class="quick-day-btn" data-days="180">半年</button>
        <button type="button" class="quick-day-btn" data-days="365">一年</button>
      </div>
      <p id="expirePreview" class="hint-text"></p>
    </div>

    <button class="btn-generate" onclick="generateKey()">生成授权密钥</button>

    <!-- 结果展示 -->
    <div class="result-card" id="resultCard">
      <h3><span>✅</span> 密钥生成成功</h3>
      <div class="key-display" id="keyDisplay">
        <!-- 生成的密钥会显示在这里 -->
        <button class="btn-copy" onclick="copyKey()">复制密钥</button>
      </div>
      <div class="info-row">
        <span>授权天数：</span>
        <span id="daysInfo">365天</span>
      </div>
      <div class="info-row">
        <span>有效期至：</span>
        <span id="expireInfo">2027-03-21 22:00:00</span>
      </div>
    </div>

    <!-- 底部 -->
    <div class="footer">
      © 2026 未策 - 授权密钥生成工具
    </div>
  </div>

  <script>
    // 与应用端保持一致的密钥
    const SECRET_KEY = 'y1119557970s17628196973c19980215';

    // 加解密函数（与应用端一致）
    const Crypto = {
      encrypt: function (text) {
        let encrypted = '';
        for (let i = 0; i < text.length; i++) {
          encrypted += String.fromCharCode(text.charCodeAt(i) + SECRET_KEY.charCodeAt(i % SECRET_KEY.length));
        }
        return btoa(encrypted);
      },
      decrypt: function (encrypted) {
        let decrypted = '';
        const raw = atob(encrypted);
        for (let i = 0; i < raw.length; i++) {
          decrypted += String.fromCharCode(raw.charCodeAt(i) - SECRET_KEY.charCodeAt(i % SECRET_KEY.length));
        }
        return decrypted;
      }
    };

    // 解析旧密钥，返回 { machineCode, expireTime } 或 null
    function parseOldLicense(oldKey) {
      try {
        const trimmed = (oldKey || '').trim();
        if (!trimmed) return null;
        const decryptedText = Crypto.decrypt(trimmed);
        const [machineCode, expireTimeStr] = decryptedText.split('|');
        const expireTime = parseInt(expireTimeStr);
        if (!machineCode || isNaN(expireTime)) return null;
        return { machineCode, expireTime };
      } catch (err) {
        return null;
      }
    }

    // 生成密钥
    function generateKey() {
      const machineCodeInput = document.getElementById('machineCode');
      const oldKeyInput = document.getElementById('oldKey');
      const renewMode = document.getElementById('renewMode');
      const days = parseInt(document.getElementById('days').value);
      const resultCard = document.getElementById('resultCard');
      const keyDisplay = document.getElementById('keyDisplay');
      const daysInfo = document.getElementById('daysInfo');
      const expireInfo = document.getElementById('expireInfo');

      let machineCode = machineCodeInput.value.trim();
      let baseExpireTime = Date.now();

      if (renewMode.checked) {
        // 延续模式：以旧密钥到期时间作为基准
        const oldKey = oldKeyInput.value.trim();
        if (!oldKey) {
          alert('请填写旧授权密钥！');
          oldKeyInput.focus();
          return;
        }
        const parsed = parseOldLicense(oldKey);
        if (!parsed) {
          alert('旧密钥格式错误或无效，请检查后重新输入');
          oldKeyInput.focus();
          return;
        }
        // 延续模式下，机器码直接从旧密钥提取
        machineCode = parsed.machineCode;
        machineCodeInput.value = machineCode;
        // 基准时间：旧到期时间（若已过期则从当前时间起算）
        baseExpireTime = Math.max(parsed.expireTime, Date.now());
      }

      // 验证输入
      if (!machineCode) {
        alert('请输入用户的机器码！');
        machineCodeInput.focus();
        return;
      }

      if (isNaN(days) || days <= 0) {
        alert('授权天数必须是大于0的数字！');
        document.getElementById('days').focus();
        return;
      }

      // 计算过期时间
      const expireTime = baseExpireTime + days * 24 * 60 * 60 * 1000;
      const expireDate = new Date(expireTime).toLocaleString('zh-CN');

      // 生成密钥
      const plainText = `${machineCode}|${expireTime}`;
      const licenseKey = Crypto.encrypt(plainText);

      // 显示结果
      keyDisplay.innerHTML = `${licenseKey}<button class="btn-copy" onclick="copyKey()">复制密钥</button>`;
      daysInfo.textContent = `${days}天`;
      expireInfo.textContent = expireDate;
      resultCard.classList.add('show');

      // 滚动到结果区域
      resultCard.scrollIntoView({ behavior: 'smooth' });
    }

    // 快速选择天数
    function initQuickDays() {
      const daysInput = document.getElementById('days');
      const quickContainer = document.getElementById('quickDays');
      const buttons = quickContainer.querySelectorAll('.quick-day-btn');

      function syncActiveState() {
        const current = parseInt(daysInput.value);
        buttons.forEach(btn => {
          if (parseInt(btn.dataset.days) === current) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        });
        updateExpirePreview();
      }

      buttons.forEach(btn => {
        btn.addEventListener('click', function () {
          daysInput.value = this.dataset.days;
          syncActiveState();
        });
      });

      daysInput.addEventListener('input', syncActiveState);
      syncActiveState();
    }

    // 更新到期时间预览
    function updateExpirePreview() {
      const preview = document.getElementById('expirePreview');
      const daysInput = document.getElementById('days');
      const renewMode = document.getElementById('renewMode');
      const oldKeyInput = document.getElementById('oldKey');
      if (!preview) return;

      const days = parseInt(daysInput.value);
      if (isNaN(days) || days <= 0) {
        preview.textContent = '';
        return;
      }

      const now = Date.now();
      let baseTime = now;
      let modeText = '到期时间';

      if (renewMode && renewMode.checked) {
        // 延续模式：以旧密钥到期时间（或当前时间）为基准
        const oldKey = oldKeyInput.value.trim();
        if (oldKey) {
          const parsed = parseOldLicense(oldKey);
          if (parsed) {
            baseTime = Math.max(parsed.expireTime, now);
            modeText = '新到期时间';
          } else {
            preview.textContent = '⚠ 旧密钥无效，无法计算新到期时间';
            preview.classList.remove('success');
            return;
          }
        } else {
          preview.textContent = '请先填写旧密钥';
          preview.classList.remove('success');
          return;
        }
      }

      const expireTime = baseTime + days * 24 * 60 * 60 * 1000;
      const expireDate = new Date(expireTime);
      const y = expireDate.getFullYear();
      const m = String(expireDate.getMonth() + 1).padStart(2, '0');
      const d = String(expireDate.getDate()).padStart(2, '0');
      const h = String(expireDate.getHours()).padStart(2, '0');
      const min = String(expireDate.getMinutes()).padStart(2, '0');
      preview.textContent = `✓ 预计${modeText}：${y}-${m}-${d} ${h}:${min}`;
      preview.classList.add('success');
    }

    // 复制密钥
    function copyKey() {
      const keyDisplay = document.getElementById('keyDisplay');
      const keyText = keyDisplay.textContent.replace('复制密钥', '').trim();
      
      navigator.clipboard.writeText(keyText).then(() => {
        alert('授权密钥已复制到剪贴板！');
      }).catch(() => {
        // 降级方案
        const tempInput = document.createElement('input');
        tempInput.value = keyText;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand('copy');
        document.body.removeChild(tempInput);
        alert('授权密钥已复制到剪贴板！');
      });
    }

    // 初始化快速选择
    initQuickDays();

    // 延续模式交互
    (function initRenewMode() {
      const renewMode = document.getElementById('renewMode');
      const oldKeyGroup = document.getElementById('oldKeyGroup');
      const oldKeyInput = document.getElementById('oldKey');
      const oldKeyInfo = document.getElementById('oldKeyInfo');
      const machineCodeGroup = document.getElementById('machineCodeGroup');
      const machineCodeInput = document.getElementById('machineCode');
      const daysLabel = document.getElementById('daysLabel');
      const quickDaysLabel = document.getElementById('quickDaysLabel');
      const daysInput = document.getElementById('days');

      function parseAndShow() {
        oldKeyInfo.classList.remove('error', 'success');
        const value = oldKeyInput.value.trim();
        if (!value) {
          oldKeyInfo.textContent = '';
          return;
        }
        const parsed = parseOldLicense(value);
        if (!parsed) {
          oldKeyInfo.textContent = '⚠ 旧密钥格式错误或无效';
          oldKeyInfo.classList.add('error');
          return;
        }
        const expireDate = new Date(parsed.expireTime);
        const now = Date.now();
        const remainingMs = parsed.expireTime - now;
        const remainingDays = Math.ceil(remainingMs / (1000 * 60 * 60 * 24));
        let remainText;
        if (remainingDays > 0) {
          remainText = `剩余 ${remainingDays} 天`;
        } else if (remainingDays === 0) {
          remainText = '今天到期';
        } else {
          remainText = `已过期 ${Math.abs(remainingDays)} 天`;
        }
        oldKeyInfo.textContent = `到期时间：${expireDate.toLocaleString('zh-CN')}（${remainText}）`;
        oldKeyInfo.classList.add('success');
        // 自动回填机器码
        machineCodeInput.value = parsed.machineCode;
      }

      renewMode.addEventListener('change', function () {
        if (this.checked) {
          // 切换为延续模式：隐藏机器码输入框、显示旧密钥输入框、修改标签
          machineCodeGroup.classList.add('hidden');
          machineCodeInput.value = '';
          oldKeyGroup.classList.remove('hidden');
          daysLabel.textContent = '延续有效期（天数）';
          quickDaysLabel.textContent = '在当前到期时间上叠加：';
          parseAndShow();
        } else {
          // 切回普通模式
          machineCodeGroup.classList.remove('hidden');
          oldKeyGroup.classList.add('hidden');
          oldKeyInput.value = '';
          oldKeyInfo.textContent = '';
          daysLabel.textContent = '授权有效期（天数）';
          quickDaysLabel.textContent = '快速选择：';
        }
        updateExpirePreview();
      });

      oldKeyInput.addEventListener('input', function () {
        parseAndShow();
        updateExpirePreview();
      });
    })();
  </script>
</body>
</html>
